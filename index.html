<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>BugByDaylight</title>
        <script src="js/public/three/three.js" data-ke-src="public/three/three.js"></script>
        <script src="js/public/three/stats.min.js"></script>
        <script src="js/public/three/three.module.js"></script>
        <script src="js/public/three/OrbitControls.js"></script>
        <script src="js/public/three/SceneUtils.js"></script>
        <script src="js/public/three/Lensflare.js"></script>
        <script src="js/public/three/loaders/FBXLoader.js"></script>
        <script src="js/public/three/loaders/MTLLoader.js"></script>
        <script src="js/public/three/loaders/OBJLoader.js"></script>
        <script src="js/public/three/loaders/TGALoader.js"></script>
        <script src="js/public/three/loaders/DDSLoader.js"></script>

        <script src="js/public/three/loaders/mmd/mmdparser.min.js"></script>
        <script src="js/public/three/ammo.js"></script>
        <script src="js/public/three/loaders/mmd/Detector.js"></script>
        <script src="js/public/three/loaders/MMDLoader.js"></script>
        <script src="js/public/three/loaders/mmd/MMDPhysics.js"></script>
        <script src="js/public/three/loaders/mmd/CCDIKSolver.js"></script>

        <script src="js/public/libs/inflate.min.js"></script>
        <script src="js/public/libs/jquery-1.12.4.min.js"></script>
        <script src="js/public/libs/jquery.cookie.js"></script>
        <style type="text/css">
            div#horizontal {
                display: flex;
            }
            div#canvas-frame {
                border: none;
                cursor: pointer;
                width: 100%;
                height: 100%;
                background-color: #EEEEEE;
            }
            div#progress {
                width: 100%;
                height: 30px;
                background: #FFFFFF;
            }
            div#bar {
                width: 0%;
                height: 28px;
                margin-top: 1px;
                background: purple;
            }
            div#text-progress {
                float: left;
            }
        </style>
    </head>

    <body onkeypress="game.playAnimation.call(game, 1)">
        <script type="module" src="js/BugByDaylight.js"></script>
        <script type="module" >
            import {BugByDaylight} from "./js/BugByDaylight.js";

            var game;
            document.addEventListener("DOMContentLoaded", function() {
                game = new BugByDaylight(); 
                window.game = game;
            });
        </script>
        <!--fixed Row 进度条-->
        <div id="main-container">
            <div id="horizontal">
                <h4 style="width: 70px; height: 15px; margin: 5px;">模型：</h4>
                <select id="character_select" name="character" style="margin: 5px" onchange="game.characterSelect.call(game, 1)">
                    <option value="0" id="feng_min">
                        凤敏
                    </option>
                    <option value="1" id="meg_thomas">
                        Meg Thomas
                    </option>
                </select>
                <h4 style="width: 70px; height: 15px; margin: 5px;">动作：</h4>
                <select id="motion_select" name="motion" style="margin: 5px" onchange="motionSelect(this)">
                    <option value="qiansixi" id="qiansixi">
                        牵丝戏
                    </option>
                    <option value="hongzhaoyuan" id="hongzhaoyuan">
                        红昭愿
                    </option>
                </select>

                <h4 style="width: 70px; height: 15px; margin: 5px;">进度：</h4>
                <div><h4 id="text-progress" style="width: 70px; height: 15px; margin: 5px">0%</h3></div>
                <div id="progress">
                    <div id="bar"></div>
                </div>
            </div>
            <div id="canvas-frame"></div>
        </div>
    </body>
</html>
